[project]
name = "iden-sdk"
version = "0.0.1"
description = "iden Python SDK."
authors = [
    {name = "ryan-iden", email = "wangsiyuan19990317@gmail.com"},
]
dependencies = [
    "aiohttp<4.0.0,>=3.8.5",
    "pydantic<3.0.0,>=2.1.1",
    "pyjwt[crypto]<3.0.0,>=2.8.0",
]
requires-python = "<4.0,>=3.8"
readme = "README.md"
license = {text = "MIT"}
keywords = ["iden", "auth", "user", "authentication", "authorization"]

[project.optional-dependencies]
dev = [
    "flask[async]>=2.3.3",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.1",
    "black>=24.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.6",
]
docs = ["pydoc-markdown>=4.8.2"]

[project.urls]
homepage = "https://github.com/ryan-iden/python"
repository = "https://github.com/ryan-iden/python"
documentation = "https://github.com/ryan-iden/python/tree/ryan-wong-coder-personal/docs"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.coverage.run]
branch = true
omit = ["*_test.py"]
source = ["iden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pydoc-markdown]

[[tool.pydoc-markdown.loaders]]
type = "python"

[tool.pydoc-markdown.renderer]
filename = "docs/api.md"
type = "markdown"
descriptive_class_title = false
render_toc = true
toc_maxdepth = 1
render_toc_title = "iden Python SDK API reference"

[[tool.pydoc-markdown.processors]]
type = "filter"
expression = "not name.endswith('_test') and default()"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
test = "pytest --cov --cov-report=term-missing"
flask = "flask --app samples.flask --debug run"
doc = "pydoc-markdown"

[tool.pdm.build]
includes = []
